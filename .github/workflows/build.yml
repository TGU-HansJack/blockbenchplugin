name: 构建插件

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出源代码
        uses: actions/checkout@v7

      - name: 设置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 检查代码
        run: npm run lint

      - name: 生成模型 schema
        run: npm run gen_schema

      - name: 构建插件
        run: npm run build

      - name: 上传插件与许可证
        uses: actions/upload-artifact@v7
        with:
          name: vintagestory
          path: dist/
          if-no-files-found: error
          retention-days: 30
