name: 创建发布草稿

on:
  workflow_dispatch:
    inputs:
      release_description:
        description: 发布说明
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: 检出源代码
        uses: actions/checkout@v7

      - name: 设置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 读取项目版本
        id: version
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const version = pkg.version;
          if (typeof version !== 'string' || !/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version)) {
            throw new Error('package.json 中的版本号必须为 major.minor.patch 格式');
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\ntag=v${version}\n`);
          NODE

      - name: 检查代码
        run: npm run lint

      - name: 生成模型 schema
        run: npm run gen_schema

      - name: 构建插件
        run: npm run build

      - name: 打包插件与许可证
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        working-directory: dist
        run: zip -r "../vintagestory-${RELEASE_VERSION}.zip" .

      - name: 创建草稿并上传文件
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_DESCRIPTION: ${{ inputs.release_description }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          printf '%s\n' "$RELEASE_DESCRIPTION" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$RELEASE_TAG" \
            --draft \
            --target "$RELEASE_COMMIT" \
            --title "Vintage Story 格式支持 ${RELEASE_VERSION}" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            dist/vintagestory.js "vintagestory-${RELEASE_VERSION}.zip" dist/LICENSE
