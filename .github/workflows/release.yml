name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Version increment'
        required: true
        type: choice
        options: [patch, minor, major]
      release_description:
        description: 'Release notes'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get next version
        uses: reecetech/version-increment@2024.10.1
        id: version
        with:
          scheme: semver
          increment: ${{ inputs.release_type }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm ci
          npm version "$RELEASE_VERSION" --no-git-tag-version
          npm run gen_schema
          npm run build

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_NOTES: ${{ inputs.release_description }}
        run: gh release create "$RELEASE_VERSION" dist/vintagestory.js --draft --title "$RELEASE_VERSION" --notes "$RELEASE_NOTES"
