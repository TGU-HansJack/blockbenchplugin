name: Build Plugin

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm

    - name: Build
      run: |
        npm ci
        npm run gen_schema
        npm run build

    - name: Upload Plugin
      uses: actions/upload-artifact@v4
      with:
        name: vintagestory-plugin
        path: dist/vintagestory.js
        if-no-files-found: error
